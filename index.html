<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notre Petit Univers ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #08070b;
    color: #fff;
    font-family: Georgia, serif;
    overflow-x: hidden;
}

header {
    padding: 22px 10px;
    text-align: center;
    background: #100d13;
    color: #d9b66f;
    letter-spacing: 4px;
    font-size: 17px;
    border-bottom: 1px solid #55412a;
}

.hero {
    min-height: 85vh;
    padding: 100px 22px 70px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background:
    radial-gradient(circle at top, #48202e 0%, transparent 55%),
    linear-gradient(145deg, #100b13, #1b101b, #09080c);
}

.hero .small {
    color: #d8b76e;
    letter-spacing: 5px;
    font-size: 12px;
    margin-bottom: 25px;
}

.hero h1 {
    color: #e7c77d;
    font-size: clamp(36px, 9vw, 58px);
    line-height: 1.3;
    margin-bottom: 22px;
    text-shadow: 0 0 25px #b47b4655;
}

.hero p {
    max-width: 520px;
    color: #e0d7df;
    font-size: 18px;
    line-height: 2;
}

.heart {
    color: #ff668a;
    font-size: 38px;
    animation: beat 1.2s infinite;
    margin-bottom: 20px;
}

button {
    border: 1px solid #e0bd75;
    background: linear-gradient(135deg, #d9b66f, #a77a38);
    color: #100d12;
    padding: 15px 27px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: bold;
    margin-top: 25px;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    transform: scale(1.06);
    box-shadow: 0 0 25px #d9b66f66;
}

.section {
    max-width: 750px;
    margin: auto;
    padding: 75px 22px;
    text-align: center;
}

.section h2 {
    color: #e6c477;
    font-size: 29px;
    margin-bottom: 18px;
}

.subtitle {
    color: #c6b8c3;
    font-size: 16px;
    line-height: 1.9;
    margin-bottom: 25px;
}

.card {
    background: linear-gradient(145deg, #19151e, #100e15);
    border: 1px solid #55432e;
    border-radius: 20px;
    padding: 30px 23px;
    margin-top: 25px;
    line-height: 2;
    color: #e9e1e9;
    box-shadow: 0 10px 35px #0007;
    font-size: 17px;
}

.gold {
    color: #e6c477;
}

.music {
    background: #151019;
    border: 1px solid #765936;
    padding: 18px;
    border-radius: 20px;
    margin-top: 25px;
}

.music iframe {
    width: 100%;
    height: 220px;
    border: none;
    border-radius: 12px;
}
